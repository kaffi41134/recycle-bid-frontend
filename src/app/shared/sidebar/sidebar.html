@if (open()) {
  <button
    type="button"
    class="button button-overlay lg:hidden"
    (click)="open.set(false)"
  ></button>
}
<aside
  class="sidebar"
  [class.sidebar-open]="open()"
  [class.sidebar-collapsed]="!isExpanded()"
  (keydown.escape)="open.set(false)"
>
  <a routerLink="/materials" class="brand" (click)="open.set(false)">
    <span class="brand-icon">
      <svg [lucideIcon]="brandIcon" [size]="20"></svg>
    </span>
    <span class="brand-text collapsible-content">
      <span class="brand-title">Recycle Bid</span>
      <span class="brand-subtitle">SYSTEM MANAGEMENT</span>
    </span>
  </a>
  <nav class="sidebar-nav relative isolate mt-6 flex flex-col gap-1 px-3">
    <i
      class="hl"
      [class.hl-ready]="highlight().height > 0"
      [style.top.px]="highlight().top"
      [style.height.px]="highlight().height"
    ></i>
    @for (item of navItems; track item.label) {
      <div #menuItem class="nav-entry relative z-10" (mouseenter)="moveHighlight(menuItem)">
        @if (item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="nav-active"
            ariaCurrentWhenActive="page"
            class="button button-nav gap-3"
            [title]="!isExpanded() ? item.label : null"
            (click)="open.set(false)"
          >
            <svg [lucideIcon]="item.icon" [size]="20" class="shrink-0"></svg>
            <span class="nav-label collapsible-content">{{ item.label }}</span>
          </a>
        } @else {
          <button
            type="button"
            class="button button-nav w-full gap-3 text-left"
            disabled
            [title]="isExpanded() ? '此功能尚未建置' : item.label + '（此功能尚未建置）'"
          >
            <svg [lucideIcon]="item.icon" [size]="20" class="shrink-0"></svg>
            <span class="nav-label collapsible-content">{{ item.label }}</span>
          </button>
        }
      </div>
    }
  </nav>
  <div class="sidebar-user">
    <span class="user-avatar">王</span>
    <div class="sidebar-user-info collapsible-content">
      <p class="text-sm font-semibold text-white">王大明</p>
      <p class="mt-0.5 text-xs text-[#a7c4b8]">系統管理員</p>
    </div>
  </div>
</aside>
