<div class="min-h-screen bg-[#f3f6f4]">
  <app-sidebar [(open)]="sidebarOpen" />
  <div class="lg:ml-[230px]">
    <main class="mx-auto max-w-[1600px] px-6 py-6">
      <div class="mb-4 flex items-center gap-2">
        <button
          type="button"
          class="text-button lg:hidden"
          aria-controls="sidebar"
          [attr.aria-expanded]="sidebarOpen()"
          (click)="sidebarOpen.set(!sidebarOpen())"
        >
          <svg lucideMenu [size]="20"></svg>
        </button>
        <nav class="flex items-center gap-2 text-sm font-semibold leading-5">
          <span class="inline-flex items-center gap-1.5 text-[#6b7280]">
            <svg lucideHouse [size]="16" class="text-[#9ca3af]"></svg>
            首頁
          </span>
          <svg lucideChevronRight [size]="12" class="text-[#d1d5db]"></svg>
          <span class="text-[#1f2937]">回收品項管理</span>
        </nav>
      </div>
      <router-outlet />
    </main>
  </div>
</div>
