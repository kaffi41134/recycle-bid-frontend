<dialog #dialog class="form-dialog" (cancel)="cancel($event)">
  <div class="p-7">
    <h2 class="text-xl font-bold">{{ title() }}</h2>
    <p class="mt-3 leading-6 text-[#688076]">{{ message() }}</p>
    @if (error()) {
      <p class="mt-4 rounded-lg bg-red-50 p-3 text-red-700">{{ error() }}</p>
    }
    <div class="mt-7 flex justify-end gap-3">
      <button
        type="button"
        class="button button-secondary"
        [disabled]="deleting()"
        (click)="cancel()"
      >
        <svg lucideUndo2></svg>取消
      </button>
      <button
        type="button"
        class="button button-danger"
        [disabled]="deleting() || confirmDisabled()"
        (click)="confirm()"
      >
        <svg lucideTrash></svg>{{ deleting() ? '刪除中…' : '確認刪除' }}
      </button>
    </div>
  </div>
</dialog>
